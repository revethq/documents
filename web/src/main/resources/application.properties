# Application configuration
quarkus.application.name=revet-documents

# HTTP configuration
quarkus.http.port=5051
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS,PATCH,HEAD
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin
quarkus.http.cors.exposed-headers=Content-Disposition,Content-Type
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# Database configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=revet
quarkus.datasource.password=revet
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/revet

# Hibernate ORM configuration
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.mapping.format.global=ignore

# OpenAPI configuration
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.openapi=3.1.0

# API configuration
mp.openapi.extensions.smallrye.info.title=Revet Documents
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Document Management System
mp.openapi.extensions.smallrye.info.contact.email=contact@revethq.com
mp.openapi.extensions.smallrye.info.contact.name=Revet
mp.openapi.extensions.smallrye.info.license.name=MIT
mp.openapi.extensions.smallrye.info.license.url=https://opensource.org/license/mit

# Logging
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."com.revethq.documents".level=DEBUG

# Encryption key for sensitive data (32 bytes / 256 bits, base64 encoded)
# Generate with: openssl rand -base64 32
revet.encryption.key=${REVET_ENCRYPTION_KEY:k2/m46TYgb00+Wl+su7T0gjLKIawmi2an7x+eRB2Okk=}

# JWT/OIDC Configuration
mp.jwt.verify.publickey.location=https://sso.ndptc.manoa.hawaii.edu/realms/ndptc-test/protocol/openid-connect/certs
mp.jwt.verify.issuer=https://sso.ndptc.manoa.hawaii.edu/realms/ndptc-test
smallrye.jwt.path.groups=roles
quarkus.smallrye-jwt.enabled=true

# User provisioning: "auto" creates users on first JWT-authenticated request (no permissions assigned)
revet.auth.user.provision=auto

# S3/GCS configuration (clients built manually, disable dev services)
quarkus.s3.devservices.enabled=false
# GCS dev services not available in this Quarkiverse version

# Jandex index for Revet library bean discovery
# Note: revet-core-web is intentionally NOT indexed to avoid duplicate JAX-RS endpoint
# registration. We subclass its resources (OrganizationResource, ProjectResource) locally
# with @RequiresPermission and only need compile-time access to the library's DTOs/mappers.
quarkus.index-dependency.revet-buckets-web.group-id=com.revethq.buckets
quarkus.index-dependency.revet-buckets-web.artifact-id=revet-buckets-web
quarkus.index-dependency.revet-buckets-persistence.group-id=com.revethq.buckets
quarkus.index-dependency.revet-buckets-persistence.artifact-id=revet-buckets-persistence-runtime
quarkus.index-dependency.revet-core-persistence.group-id=com.revethq.core
quarkus.index-dependency.revet-core-persistence.artifact-id=revet-core-persistence-runtime
quarkus.index-dependency.revet-capabilities-web.group-id=com.revethq.capabilities
quarkus.index-dependency.revet-capabilities-web.artifact-id=revet-capabilities-web
quarkus.index-dependency.revet-capabilities-persistence.group-id=com.revethq.capabilities
quarkus.index-dependency.revet-capabilities-persistence.artifact-id=revet-capabilities-persistence-runtime
quarkus.index-dependency.revet-capabilities-core.group-id=com.revethq.capabilities
quarkus.index-dependency.revet-capabilities-core.artifact-id=revet-capabilities-core

# Native image configuration
quarkus.native.additional-build-args=--initialize-at-run-time=org.hibernate.type.format.jakartajson.JakartaJsonIntegration\\,io.grpc.netty.shaded.io.netty.util.internal.logging.InternalLoggerFactory\\,io.grpc.netty.shaded.io.netty.util.internal.PlatformDependent,--enable-sbom=embed\\,export
