# Revet Documents - Development Docker Compose
#
# Runs the API and webapp with hot-reload enabled via volume mounts.
#
# Usage:
#   docker compose -f docker-compose-dev.yml up
#
# Services:
#   - Webapp:        http://localhost:3000 (Next.js dev server)
#   - API:           http://localhost:5051 (Quarkus dev mode)
#   - API Swagger:   http://localhost:5051/swagger-ui
#   - MinIO Console: http://localhost:9001 (minioadmin / minioadmin)
#   - PostgreSQL:    localhost:5432        (revet / revet)

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: revet
      POSTGRES_USER: revet
      POSTGRES_PASSWORD: revet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revet -d revet"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================================================
  # MinIO (S3-compatible object storage)
  # ==========================================================================
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Create a default bucket on startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/documents;
      exit 0;
      "

  # ==========================================================================
  # Documents API (Quarkus dev mode with hot-reload)
  # ==========================================================================
  api:
    image: eclipse-temurin:25-jdk
    working_dir: /app
    command: ./gradlew quarkusDev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - gradle_cache:/root/.gradle
    environment:
      # Database
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/revet
      QUARKUS_DATASOURCE_USERNAME: revet
      QUARKUS_DATASOURCE_PASSWORD: revet
      QUARKUS_DATASOURCE_JDBC_MIN_SIZE: "2"
      QUARKUS_DATASOURCE_JDBC_MAX_SIZE: "10"
      # HTTP - bind to all interfaces for container access
      QUARKUS_HTTP_HOST: "0.0.0.0"
      QUARKUS_HTTP_PORT: "5051"
      # CORS - allow the webapp origin
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:3000
      # Dev mode settings
      QUARKUS_LIVE_RELOAD_INSTRUMENTATION: "true"
    ports:
      - "5051:5051"
      - "5005:5005"  # Debug port
    stdin_open: true
    tty: true

  # ==========================================================================
  # Documents Webapp (Next.js dev mode with hot-reload)
  # ==========================================================================
  webapp:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api
    volumes:
      - ../documents-webapp:/app
      - webapp_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5051
      NEXT_PUBLIC_OIDC_AUTHORIZATION_SERVER_URI: https://auth.cartobucket.com/ef00f143-f2fb-47e0-ad80-0f4a42581090
      NEXT_PUBLIC_OIDC_CLIENT_ID: 8b44a3c1-90dd-40bb-bfd9-231e9d7b21cb
      NEXT_PUBLIC_OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
      NEXT_PUBLIC_OIDC_SCOPE: openid email profile
      # Bind to all interfaces for container access
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  minio_data:
  gradle_cache:
  webapp_node_modules:
