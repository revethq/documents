# Revet Documents - All-in-one Docker Compose
#
# Starts: PostgreSQL, MinIO, Documents API (Quarkus), Documents Webapp (Next.js)
#
# Prerequisites:
#   The API build requires revet-* packages from your local Maven repository.
#   Build the API before running compose:
#
#     ./gradlew build -x test
#
# Usage:
#   docker compose up --build
#
# Services:
#   - Webapp:        http://localhost:3000
#   - API:           http://localhost:5051
#   - API Swagger:   http://localhost:5051/swagger-ui
#   - MinIO Console: http://localhost:9001  (minioadmin / minioadmin)
#   - PostgreSQL:    localhost:5432         (revet / revet)

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: revet
      POSTGRES_USER: revet
      POSTGRES_PASSWORD: revet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revet -d revet"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================================================
  # MinIO (S3-compatible object storage)
  # ==========================================================================
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Create a default bucket on startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/documents;
      exit 0;
      "

  # ==========================================================================
  # Documents API (Quarkus backend - JVM mode)
  # ==========================================================================
  # Requires: ./gradlew build -x test
  api:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/revet
      QUARKUS_DATASOURCE_USERNAME: revet
      QUARKUS_DATASOURCE_PASSWORD: revet
      QUARKUS_DATASOURCE_JDBC_MIN_SIZE: "2"
      QUARKUS_DATASOURCE_JDBC_MAX_SIZE: "10"
      # HTTP
      QUARKUS_HTTP_PORT: "5051"
      # CORS - allow the webapp origin
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:3000
    ports:
      - "5051:5051"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5051/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==========================================================================
  # Documents Webapp (Next.js frontend)
  # ==========================================================================
  webapp:
    build:
      context: ../documents-webapp
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5051
      NEXT_PUBLIC_OIDC_AUTHORIZATION_SERVER_URI: https://auth.cartobucket.com/ef00f143-f2fb-47e0-ad80-0f4a42581090
      NEXT_PUBLIC_OIDC_CLIENT_ID: 8b44a3c1-90dd-40bb-bfd9-231e9d7b21cb
      NEXT_PUBLIC_OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
      NEXT_PUBLIC_OIDC_SCOPE: openid email profile
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
